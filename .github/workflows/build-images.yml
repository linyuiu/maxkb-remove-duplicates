name: Build installation images
run-name: Build ${{ inputs.image_tag }} (amd64 + arm64)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Application image tag
        type: string
        required: true
        default: v1.0.0

permissions:
  contents: write

env:
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      image_tag: ${{ steps.inputs.outputs.image_tag }}
    steps:
      - name: Validate inputs
        id: inputs
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo 'Invalid Docker image tag' >&2
            exit 1
          fi
          printf 'image_tag=%s\n' "$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build application image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          tags: maxkb-remove-duplicates:${{ env.IMAGE_TAG }}
          load: true
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

      - name: Prepare architecture-specific installation package
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform "linux/$TARGET_ARCH" postgres:18
          for image in "maxkb-remove-duplicates:$IMAGE_TAG" postgres:18; do
            actual="$(docker image inspect "$image" --format '{{.Architecture}}')"
            if [[ "$actual" != "$TARGET_ARCH" ]]; then
              echo "Image architecture mismatch: $image" >&2
              exit 1
            fi
          done
          package="maxkb-remove-duplicates-$IMAGE_TAG-$TARGET_ARCH"
          directory="$RUNNER_TEMP/$package"
          mkdir -p "$directory/install" "$directory/docker/images" output
          cp install/install.sh install/.env.example "$directory/install/"
          cp docker/compose.yaml "$directory/docker/"
          export PACKAGE_DIRECTORY="$directory"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          root = Path(os.environ['PACKAGE_DIRECTORY'])
          template = root / 'install/.env.example'
          lines = template.read_text().splitlines()
          template.write_text('\n'.join(
              'IMAGE_VERSION=' + os.environ['IMAGE_TAG'] if line.startswith('IMAGE_VERSION=') else line
              for line in lines
          ) + '\n')
          (root / 'BUILD.json').write_text(json.dumps({
              'architecture': os.environ['TARGET_ARCH'],
              'image_tag': os.environ['IMAGE_TAG'],
              'repository': os.environ['GITHUB_REPOSITORY'],
              'commit': os.environ['GITHUB_SHA'],
          }, indent=2) + '\n')
          PYTHON
          docker image save "maxkb-remove-duplicates:$IMAGE_TAG" postgres:18 | gzip -1 > "$directory/docker/images/images-$TARGET_ARCH.tar.gz"
          tar -czf "output/$package.tar.gz" -C "$RUNNER_TEMP" "$package"
          (
            cd output
            checksum="$(sha256sum "$package.tar.gz")"
            printf '### Installation package\n- Architecture: `%s`\n- Image: `maxkb-remove-duplicates:%s`\n- SHA-256: `%s`\n' "$TARGET_ARCH" "$IMAGE_TAG" "$checksum"
            printf '%s\n' '- Download the .tar.gz from the Releases page, extract it once, then run `bash install/install.sh`.'
          ) >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          file="output/maxkb-remove-duplicates-$IMAGE_TAG-$TARGET_ARCH.tar.gz"
          gh release view "$IMAGE_TAG" >/dev/null 2>&1 \
            || gh release create "$IMAGE_TAG" --target "$GITHUB_SHA" --title "$IMAGE_TAG" --notes "Installation packages" \
            || gh release view "$IMAGE_TAG" >/dev/null
          gh release upload "$IMAGE_TAG" "$file" --clobber