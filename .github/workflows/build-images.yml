name: Build installation images
run-name: Build ${{ inputs.image_tag }} / ${{ inputs.architecture }}

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: CPU architecture (both produces two separate installation packages)
        type: choice
        required: true
        default: amd64
        options:
          - amd64
          - arm64
          - both
      image_tag:
        description: Application image tag
        type: string
        required: true
        default: latest

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.inputs.outputs.matrix }}
      image_tag: ${{ steps.inputs.outputs.image_tag }}
    steps:
      - name: Validate inputs
        id: inputs
        env:
          ARCHITECTURE: ${{ inputs.architecture }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo 'Invalid Docker image tag' >&2
            exit 1
          fi
          case "$ARCHITECTURE" in
            amd64) matrix='{"include":[{"arch":"amd64"}]}' ;;
            arm64) matrix='{"include":[{"arch":"arm64"}]}' ;;
            both) matrix='{"include":[{"arch":"amd64"},{"arch":"arm64"}]}' ;;
            *) echo 'Invalid CPU architecture' >&2; exit 1 ;;
          esac
          printf 'matrix=%s\nimage_tag=%s\n' "$matrix" "$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable ARM emulation
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build application image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          tags: maxkb-remove-duplicates:${{ env.IMAGE_TAG }}
          load: true
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

      - name: Prepare architecture-specific installation package
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform "linux/$TARGET_ARCH" postgres:16
          for image in "maxkb-remove-duplicates:$IMAGE_TAG" postgres:16; do
            actual="$(docker image inspect "$image" --format '{{.Architecture}}')"
            if [[ "$actual" != "$TARGET_ARCH" ]]; then
              echo "Image architecture mismatch: $image" >&2
              exit 1
            fi
          done
          package="maxkb-remove-duplicates-$IMAGE_TAG-$TARGET_ARCH"
          directory="$RUNNER_TEMP/$package"
          mkdir -p "$directory/install" "$directory/docker/images" output
          cp install/install.sh install/.env.example "$directory/install/"
          cp docker/compose.yaml "$directory/docker/"
          cp README.md PLAN.md "$directory/"
          cp -r docs "$directory/docs"
          export PACKAGE_DIRECTORY="$directory"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          root = Path(os.environ['PACKAGE_DIRECTORY'])
          template = root / 'install/.env.example'
          template.write_text(template.read_text().replace('IMAGE_TAG=latest', 'IMAGE_TAG=' + os.environ['IMAGE_TAG']))
          (root / 'BUILD.json').write_text(json.dumps({
              'architecture': os.environ['TARGET_ARCH'],
              'image_tag': os.environ['IMAGE_TAG'],
              'repository': os.environ['GITHUB_REPOSITORY'],
              'commit': os.environ['GITHUB_SHA'],
          }, indent=2) + '\n')
          PYTHON
          docker image save "maxkb-remove-duplicates:$IMAGE_TAG" postgres:16 | gzip -1 > "$directory/docker/images/images-$TARGET_ARCH.tar.gz"
          tar -czf "output/$package.tar.gz" -C "$RUNNER_TEMP" "$package"
          (cd output && sha256sum "$package.tar.gz" > "$package.sha256")
          printf '### Installation package\n- Architecture: `%s`\n- Image: `maxkb-remove-duplicates:%s`\n- Download this job artifact, extract the tar.gz, then run `bash install/install.sh`.\n' "$TARGET_ARCH" "$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installation package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maxkb-remove-duplicates-${{ env.IMAGE_TAG }}-${{ matrix.arch }}
          path: |
            output/*.tar.gz
            output/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
