[project]
name = "maxkb-remove-duplicates"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "python-multipart>=0.0.20,<1", "markdown-it-py>=3,<5", "bleach>=6.2,<7", "openpyxl>=3.1,<4", "xlrd>=2,<3", "paramiko>=3.5,<5",
  "httpx>=0.28,<1", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "python-dotenv>=1,<2", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "cryptography>=44", "pwdlib[argon2]>=0.2,<1", "croniter>=6,<7",
  "numpy>=2.2,<3", "threadpoolctl>=3.5,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
